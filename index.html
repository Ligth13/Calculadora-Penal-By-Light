<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Calculadora Penal By Light</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  /* Reset básico */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }
  body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #a2d2ff 0%, #f0f5f9 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: white;
    border-radius: 16px;
    max-width: 720px;
    width: 100%;
    padding: 32px 40px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.1);
    color: #1a202c;
  }
  h2, h3 {
    text-align: center;
    color: #1d3557;
    margin-bottom: 24px;
    font-weight: 700;
  }
  label {
    display: block;
    font-weight: 600;
    margin-top: 18px;
    margin-bottom: 6px;
    color: #344055;
  }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%;
    padding: 12px 14px;
    border-radius: 10px;
    border: 1.8px solid #a1a5b9;
    font-size: 15px;
    color: #344055;
    transition: border-color 0.3s;
  }
  input[type="text"]:focus,
  input[type="number"]:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: #0077cc;
    box-shadow: 0 0 6px #0077ccaa;
  }
  select[multiple] {
    height: 130px;
  }
  button {
    cursor: pointer;
    border: none;
    font-weight: 700;
    border-radius: 12px;
    padding: 14px 0;
    margin-top: 18px;
    font-size: 16px;
    color: white;
    transition: background 0.3s ease;
    width: 100%;
    user-select: none;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-adicionar {
    background: linear-gradient(90deg, #38b000, #2f9e00);
  }
  .btn-adicionar:hover:not(:disabled) {
    background: linear-gradient(90deg, #2f9e00, #38b000);
  }
  .btn-apagar {
    background: linear-gradient(90deg, #d90429, #9b0217);
  }
  .btn-apagar:hover:not(:disabled) {
    background: linear-gradient(90deg, #9b0217, #d90429);
  }
  #calcular {
    background: linear-gradient(90deg, #023e8a, #0077cc);
  }
  #calcular:hover:not(:disabled) {
    background: linear-gradient(90deg, #0077cc, #023e8a);
  }
  #btnLogin {
    background: linear-gradient(90deg, #6a994e, #4a772a);
    margin-top: 30px;
    font-size: 16px;
    width: auto;
    padding: 12px 30px;
    border-radius: 30px;
    display: block;
    margin-left: auto;
  }
  #btnLogin:hover {
    background: linear-gradient(90deg, #4a772a, #6a994e);
  }

  hr {
    border: none;
    border-top: 1px solid #e0e6f1;
    margin: 30px 0;
  }
  .fianca-input {
    display: none;
  }
  input[type="radio"] {
    margin-right: 8px;
    accent-color: #0077cc;
  }
  /* Resultado */
  #resultado {
    margin-top: 30px;
    background: #e6f0fa;
    padding: 24px;
    border-radius: 14px;
    border-left: 6px solid #0077cc;
    color: #034078;
  }
  #resultado p {
    font-weight: 600;
    font-size: 16px;
    margin: 10px 0;
  }

  /* Modal Login */
  .modal-bg {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(10, 25, 47, 0.65);
    backdrop-filter: blur(3px);
    z-index: 1000;
    justify-content: center;
    align-items: center;
  }
  .modal-bg.active {
    display: flex;
    animation: fadeIn 0.3s ease forwards;
  }
  @keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
  }
  .modal {
    background: white;
    border-radius: 16px;
    width: 360px;
    max-width: 90vw;
    padding: 30px 24px 24px;
    box-shadow: 0 14px 28px rgba(0,0,0,0.15);
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .modal h3 {
    margin-bottom: 24px;
    text-align: center;
    color: #1d3557;
  }
  .modal input[type="password"] {
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 10px;
    border: 1.8px solid #a1a5b9;
    margin-bottom: 16px;
    transition: border-color 0.3s;
  }
  .modal input[type="password"]:focus {
    border-color: #0077cc;
    outline: none;
    box-shadow: 0 0 7px #0077ccaa;
  }
  .modal .error-msg {
    color: #d90429;
    font-size: 14px;
    margin-bottom: 14px;
    text-align: center;
    min-height: 18px;
  }
  .modal button {
    background: linear-gradient(90deg, #0077cc, #023e8a);
    font-weight: 700;
    font-size: 16px;
    padding: 12px 0;
    border-radius: 12px;
    color: white;
    user-select: none;
  }
  .modal .close-btn {
    position: absolute;
    right: 14px;
    top: 14px;
    font-size: 22px;
    color: #666;
    cursor: pointer;
    border: none;
    background: transparent;
    font-weight: 700;
  }
  .modal .close-btn:hover {
    color: #023e8a;
  }
</style>
</head>
<body>

<div class="container">
  <form id="penalForm" onsubmit="return false;">
    <h2>Calculadora Penal By Light</h2>

    <label for="nome">Nome do Acusado:</label>
    <input type="text" id="nome" placeholder="Nome completo" />

    <label for="id">ID do Acusado:</label>
    <input type="text" id="id" placeholder="Identificação" />

    <label>Pagar Fiança:</label>
    <label><input type="radio" name="fianca" value="sim" /> Sim</label>
    <label><input type="radio" name="fianca" value="nao" checked /> Não</label>

    <div class="fianca-input" id="fiancaValorContainer">
      <label for="inputFiancaManual">Valor da Fiança (R$):</label>
      <input type="number" id="inputFiancaManual" min="0" step="0.01" placeholder="Ex: 500.00" />
    </div>

    <label for="crimes">Crimes (selecione um ou mais):</label>
    <select id="crimes" multiple aria-label="Crimes"></select>
    <button type="button" id="apagarCrimes" class="btn-apagar" disabled>Apagar Crimes Selecionados</button>

    <label for="atenuantes">Atenuantes:</label>
    <select id="atenuantes" multiple aria-label="Atenuantes"></select>
    <button type="button" id="apagarAtenuantes" class="btn-apagar" disabled>Apagar Atenuantes Selecionados</button>

    <hr />

    <h3>Adicionar Novo Artigo</h3>
    <label for="novoNome">Nome do Artigo:</label>
    <input type="text" id="novoNome" placeholder="ex: art123" />

    <div class="novo-artigo-inputs" style="display:none;">
      <label for="novoMeses">Tempo de Prisão (meses):</label>
      <input type="number" id="novoMeses" min="0" />

      <label for="novoMulta">Multa (R$):</label>
      <input type="number" id="novoMulta" min="0" step="0.01" />
    </div>

    <button type="button" id="btnAdicionar" class="btn-adicionar" disabled>Adicionar Artigo</button>

    <hr />

    <h3>Adicionar/Editar Atenuante</h3>
    <label for="novoAtenuanteNome">Nome da Atenuante:</label>
    <input type="text" id="novoAtenuanteNome" placeholder="ex: colaborou" />

    <label for="novoAtenuanteReducao">Redução da Pena (%):</label>
    <input type="number" id="novoAtenuanteReducao" min="0" max="100" step="1" />

    <button type="button" id="btnAdicionarAtenuante" class="btn-adicionar" disabled>Adicionar/Editar Atenuante</button>

    <button type="button" id="calcular">Calcular</button>
    <button type="button" id="btnLogin">Login</button>
  </form>

  <div id="resultado" style="display:none;">
    <h3>Resultado:</h3>
    <p><strong>Multa Total:</strong> <span id="multa">R$ 0,00</span></p>
    <p><strong>Tempo de Prisão:</strong> <span id="penaMeses">0</span> meses</p>
    <p><strong>Redução Aplicada:</strong> <span id="reducaoPct">0%</span></p>
    <p><strong>Valor da Fiança:</strong> <span id="valorFianca">R$ 0,00</span></p>
  </div>
</div>

<!-- Modal Login -->
<div class="modal-bg" id="modalLogin">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="close-btn" aria-label="Fechar modal" id="closeModal">&times;</button>
    <h3 id="modalTitle">Login Necessário</h3>
    <input type="password" id="senhaInput" placeholder="Digite a senha" aria-describedby="erroSenha" />
    <div class="error-msg" id="erroSenha" aria-live="polite"></div>
    <button id="btnConfirmarLogin">Entrar</button>
  </div>
</div>

<script>
  // Dados iniciais
  const tabelaCrimes = {
    roubo: { meses: 10, multa: 1000 },
    homicidio: { meses: 25, multa: 3000 },
    fuga: { meses: 8, multa: 800 },
    porteIlegal: { meses: 12, multa: 1500 },
  };

  const tabelaAtenuantes = {
    naoReduzir: 0,
    reuPrimario: 50,
    confessou: 30,
    colaborou: 20,
  };

  // Elementos do DOM
  const selectCrimes = document.getElementById('crimes');
  const selectAtenuantes = document.getElementById('atenuantes');
  const novoNome = document.getElementById('novoNome');
  const novoMeses = document.getElementById('novoMeses');
  const novoMulta = document.getElementById('novoMulta');
  const btnAdicionar = document.getElementById('btnAdicionar');
  const novoInputsDiv = document.querySelector('.novo-artigo-inputs');
  const novoAtenuanteNome = document.getElementById('novoAtenuanteNome');
  const novoAtenuanteReducao = document.getElementById('novoAtenuanteReducao');
  const btnAdicionarAtenuante = document.getElementById('btnAdicionarAtenuante');
  const inputFiancaManual = document.getElementById('inputFiancaManual');
  const fiancaValorContainer = document.getElementById('fiancaValorContainer');
  const calcularBtn = document.getElementById('calcular');
  const resultadoDiv = document.getElementById('resultado');
  const multaSpan = document.getElementById('multa');
  const penaSpan = document.getElementById('penaMeses');
  const reducaoSpan = document.getElementById('reducaoPct');
  const valorFiancaSpan = document.getElementById('valorFianca');
  const apagarCrimesBtn = document.getElementById('apagarCrimes');
  const apagarAtenuantesBtn = document.getElementById('apagarAtenuantes');
  const btnLogin = document.getElementById('btnLogin');

  // Modal login elementos
  const modal = document.getElementById('modalLogin');
  const senhaInput = document.getElementById('senhaInput');
  const erroSenha = document.getElementById('erroSenha');
  const btnConfirmarLogin = document.getElementById('btnConfirmarLogin');
  const closeModalBtn = document.getElementById('closeModal');

  // Preenche selects iniciais
  function preencherSelects() {
    // Crimes
    selectCrimes.innerHTML = '';
    for (const chave in tabelaCrimes) {
      const opt = document.createElement('option');
      opt.value = chave;
      opt.textContent = chave.charAt(0).toUpperCase() + chave.slice(1);
      selectCrimes.appendChild(opt);
    }
    // Atenuantes
    selectAtenuantes.innerHTML = '';
    for (const chave in tabelaAtenuantes) {
      if (chave === 'naoReduzir') continue; // não mostrar opção de zero aqui
      const opt = document.createElement('option');
      opt.value = chave;
      opt.textContent = chave.charAt(0).toUpperCase() + chave.slice(1);
      selectAtenuantes.appendChild(opt);
    }
  }

  preencherSelects();

  // Mostra/oculta input da fiança
  document.querySelectorAll('input[name="fianca"]').forEach(radio => {
    radio.addEventListener('change', e => {
      if (e.target.value === 'sim') {
        fiancaValorContainer.style.display = 'block';
      } else {
        fiancaValorContainer.style.display = 'none';
        inputFiancaManual.value = '';
      }
    });
  });

  // Mostrar campos de meses e multa só se nome preenchido
  novoNome.addEventListener('input', () => {
    if (novoNome.value.trim() !== '') {
      novoInputsDiv.style.display = 'block';
      btnAdicionar.disabled = false && loginStatus === false ? true : false;
    } else {
      novoInputsDiv.style.display = 'none';
      btnAdicionar.disabled = true;
    }
  });

  // Habilitar botões Adicionar/Apagar somente após login
  let loginStatus = false;

  function atualizarBotoes() {
    const estado = loginStatus ? false : true;
    btnAdicionar.disabled = estado || novoNome.value.trim() === '';
    btnAdicionarAtenuante.disabled = estado || novoAtenuanteNome.value.trim() === '' || novoAtenuanteReducao.value === '';
    apagarCrimesBtn.disabled = estado;
    apagarAtenuantesBtn.disabled = estado;
  }

  // Inputs de atenuantes
  novoAtenuanteNome.addEventListener('input', () => {
    btnAdicionarAtenuante.disabled = loginStatus ? (novoAtenuanteNome.value.trim() === '' || novoAtenuanteReducao.value === '') : true;
  });
  novoAtenuanteReducao.addEventListener('input', () => {
    btnAdicionarAtenuante.disabled = loginStatus ? (novoAtenuanteNome.value.trim() === '' || novoAtenuanteReducao.value === '') : true;
  });

  // Botão Adicionar Artigo
  btnAdicionar.addEventListener('click', () => {
    const nome = novoNome.value.trim().toLowerCase();
    const meses = parseInt(novoMeses.value, 10);
    const multa = parseFloat(novoMulta.value);
    if (!nome || isNaN(meses) || isNaN(multa)) {
      alert('Preencha corretamente os campos do artigo.');
      return;
    }
    tabelaCrimes[nome] = { meses, multa };
    const optExists = Array.from(selectCrimes.options).some(opt => opt.value === nome);
    if (!optExists) {
      const opt = document.createElement('option');
      opt.value = nome;
      opt.textContent = nome.charAt(0).toUpperCase() + nome.slice(1);
      selectCrimes.appendChild(opt);
    }
    novoNome.value = '';
    novoMeses.value = '';
    novoMulta.value = '';
    novoInputsDiv.style.display = 'none';
    btnAdicionar.disabled = true;
    alert(`Artigo "${nome}" adicionado/editado com sucesso.`);
  });

  // Botão Adicionar/Editar Atenuante
  btnAdicionarAtenuante.addEventListener('click', () => {
    const nome = novoAtenuanteNome.value.trim().toLowerCase();
    const reducao = parseInt(novoAtenuanteReducao.value, 10);
    if (!nome || isNaN(reducao) || reducao < 0 || reducao > 100) {
      alert('Preencha corretamente o nome e a redução da atenuante.');
      return;
    }
    tabelaAtenuantes[nome] = reducao;
    const optExists = Array.from(selectAtenuantes.options).some(opt => opt.value === nome);
    if (!optExists) {
      const opt = document.createElement('option');
      opt.value = nome;
      opt.textContent = nome.charAt(0).toUpperCase() + nome.slice(1);
      selectAtenuantes.appendChild(opt);
    }
    novoAtenuanteNome.value = '';
    novoAtenuanteReducao.value = '';
    btnAdicionarAtenuante.disabled = true;
    alert(`Atenuante "${nome}" adicionada/editada com sucesso.`);
  });

  // Botão Apagar Crimes Selecionados
  apagarCrimesBtn.addEventListener('click', () => {
    const selecionados = Array.from(selectCrimes.selectedOptions);
    if (selecionados.length === 0) {
      alert('Selecione ao menos um crime para apagar.');
      return;
    }
    selecionados.forEach(opt => {
      delete tabelaCrimes[opt.value];
      opt.remove();
    });
  });

  // Botão Apagar Atenuantes Selecionados
  apagarAtenuantesBtn.addEventListener('click', () => {
    const selecionados = Array.from(selectAtenuantes.selectedOptions);
    if (selecionados.length === 0) {
      alert('Selecione ao menos uma atenuante para apagar.');
      return;
    }
    selecionados.forEach(opt => {
      delete tabelaAtenuantes[opt.value];
      opt.remove();
    });
  });

  // Botão Calcular
  calcularBtn.addEventListener('click', () => {
    const nomeAcusado = document.getElementById('nome').value.trim();
    if (!nomeAcusado) {
      alert('Por favor, informe o nome do acusado.');
      return;
    }
    const crimesSelecionados = Array.from(selectCrimes.selectedOptions).map(opt => opt.value);
    if (crimesSelecionados.length === 0) {
      alert('Selecione ao menos um crime.');
      return;
    }
    const atenuantesSelecionados = Array.from(selectAtenuantes.selectedOptions).map(opt => opt.value);

    // Soma meses e multas dos crimes
    let totalMeses = 0;
    let totalMulta = 0;
    crimesSelecionados.forEach(c => {
      const dado = tabelaCrimes[c];
      if (dado) {
        totalMeses += dado.meses;
        totalMulta += dado.multa;
      }
    });

    // Calcula redução total da pena (%)
    let reducaoTotal = 0;
    atenuantesSelecionados.forEach(a => {
      const val = tabelaAtenuantes[a];
      if (val) {
        reducaoTotal += val;
      }
    });
    if (reducaoTotal > 100) reducaoTotal = 100;

    // Aplica redução na pena
    const penaReduzida = totalMeses * (1 - reducaoTotal / 100);

    // Fiança
    let valorFianca = 0;
    const pagarFianca = document.querySelector('input[name="fianca"]:checked').value === 'sim';
    if (pagarFianca) {
      const valFiancaManual = parseFloat(inputFiancaManual.value);
      if (!isNaN(valFiancaManual) && valFiancaManual > 0) {
        valorFianca = valFiancaManual;
      } else {
        valorFianca = totalMulta * 0.5;
      }
    }

    // Exibe resultado
    multaSpan.textContent = 'R$ ' + totalMulta.toFixed(2).replace('.', ',');
    penaSpan.textContent = penaReduzida.toFixed(2).replace('.', ',');
    reducaoSpan.textContent = reducaoTotal.toFixed(2) + '%';
    valorFiancaSpan.textContent = 'R$ ' + valorFianca.toFixed(2).replace('.', ',');
    resultadoDiv.style.display = 'block';
  });

  // Abrir modal Login
  btnLogin.addEventListener('click', () => {
    senhaInput.value = '';
    erroSenha.textContent = '';
    modal.classList.add('active');
    senhaInput.focus();
  });

  // Fechar modal
  closeModalBtn.addEventListener('click', () => {
    modal.classList.remove('active');
  });

  // Confirmar Login
  btnConfirmarLogin.addEventListener('click', () => {
    const senhaCorreta = 'senha123'; // Defina aqui sua senha real
    const senhaDigitada = senhaInput.value.trim();
    if (senhaDigitada === senhaCorreta) {
      loginStatus = true;
      atualizarBotoes();
      modal.classList.remove('active');
      alert('Login efetuado com sucesso!');
    } else {
      erroSenha.textContent = 'Senha incorreta. Tente novamente.';
      senhaInput.focus();
    }
  });

  // Inicializa estado dos botões (bloqueados)
  atualizarBotoes();

</script>

</body>
</html>
